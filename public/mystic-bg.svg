<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="신비한 보라색 회전목마 배경">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b7dd6"/>
      <stop offset="35%" stop-color="#c8a8e8"/>
      <stop offset="70%" stop-color="#e6d4f2"/>
      <stop offset="100%" stop-color="#f0d8e6"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff5c8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff5c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#e8d4f5" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#a878d4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5b2db8" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="hatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4ec8"/>
      <stop offset="100%" stop-color="#5b2db8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4ec8"/>
      <stop offset="100%" stop-color="#a878d4"/>
    </linearGradient>
    <linearGradient id="tentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b4e8"/>
      <stop offset="100%" stop-color="#a878d4"/>
    </linearGradient>
    <radialGradient id="cloudGrad" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#f5d4e8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4b4e8" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- 하늘 배경 -->
  <rect width="800" height="1700" fill="url(#sky)"/>

  <!-- 별들 (위쪽) -->
  <g fill="#fff8d4">
    <circle cx="80" cy="100" r="3"/>
    <circle cx="180" cy="60" r="2"/>
    <circle cx="220" cy="140" r="1.5"/>
    <circle cx="320" cy="80" r="2.5"/>
    <circle cx="400" cy="50" r="1.5"/>
    <circle cx="480" cy="100" r="2"/>
    <circle cx="540" cy="170" r="1.5"/>
    <circle cx="600" cy="60" r="3"/>
    <circle cx="700" cy="120" r="2"/>
    <circle cx="160" cy="220" r="2"/>
    <circle cx="280" cy="280" r="1.5"/>
    <circle cx="380" cy="240" r="2"/>
    <circle cx="500" cy="320" r="1.5"/>
    <circle cx="620" cy="260" r="2.5"/>
    <circle cx="730" cy="200" r="2"/>
    <circle cx="60" cy="340" r="1.5"/>
    <circle cx="200" cy="380" r="2"/>
    <circle cx="350" cy="420" r="1.5"/>
    <circle cx="450" cy="380" r="2"/>
    <circle cx="560" cy="440" r="1.5"/>
    <circle cx="680" cy="400" r="2"/>
    <circle cx="120" cy="500" r="1.5"/>
    <circle cx="270" cy="540" r="2"/>
    <circle cx="420" cy="500" r="1.5"/>
    <circle cx="540" cy="580" r="1.5"/>
    <circle cx="680" cy="520" r="2"/>
    <circle cx="80" cy="640" r="2"/>
    <circle cx="220" cy="680" r="1.5"/>
    <circle cx="380" cy="620" r="1.5"/>
    <circle cx="500" cy="700" r="1.5"/>
    <circle cx="620" cy="660" r="1"/>
    <circle cx="720" cy="720" r="2"/>
    <circle cx="100" cy="800" r="1.5"/>
    <circle cx="280" cy="780" r="1"/>
    <circle cx="440" cy="820" r="1.5"/>
    <circle cx="580" cy="780" r="1"/>
    <circle cx="700" cy="860" r="1.5"/>
    <circle cx="180" cy="900" r="1.5"/>
    <circle cx="340" cy="920" r="1"/>
    <circle cx="520" cy="900" r="1.5"/>
    <circle cx="660" cy="960" r="1"/>
    <circle cx="60" cy="1020" r="1.5"/>
    <circle cx="220" cy="1040" r="1"/>
    <circle cx="380" cy="1020" r="1.5"/>
    <circle cx="540" cy="1080" r="1"/>
    <circle cx="700" cy="1040" r="1.5"/>
  </g>

  <!-- 4각 별 (반짝이) -->
  <g fill="#ffe080">
    <path d="M150 320 L153 330 L163 333 L153 336 L150 346 L147 336 L137 333 L147 330 Z"/>
    <path d="M580 220 L583 230 L593 233 L583 236 L580 246 L577 236 L567 233 L577 230 Z"/>
    <path d="M420 580 L423 590 L433 593 L423 596 L420 606 L417 596 L407 593 L417 590 Z"/>
    <path d="M250 460 L253 470 L263 473 L253 476 L250 486 L247 476 L237 473 L247 470 Z"/>
    <path d="M650 760 L653 770 L663 773 L653 776 L650 786 L647 776 L637 773 L647 770 Z"/>
    <path d="M120 720 L123 730 L133 733 L123 736 L120 746 L117 736 L107 733 L117 730 Z"/>
  </g>

  <!-- 별자리 라인 (좌상) -->
  <g stroke="#fff8d4" stroke-width="0.8" stroke-opacity="0.5" fill="none">
    <path d="M120 380 L160 420 L210 400 L240 450 L200 480 Z"/>
  </g>
  <g fill="#fff8d4">
    <circle cx="120" cy="380" r="1.5"/>
    <circle cx="160" cy="420" r="1.5"/>
    <circle cx="210" cy="400" r="1.5"/>
    <circle cx="240" cy="450" r="1.5"/>
    <circle cx="200" cy="480" r="1.5"/>
  </g>

  <!-- 별자리 라인 (우중) -->
  <g stroke="#f5b4d4" stroke-width="0.8" stroke-opacity="0.6" fill="none">
    <path d="M680 920 L720 880 L750 940 L700 960 Z"/>
  </g>
  <g fill="#f5b4d4">
    <circle cx="680" cy="920" r="1.5"/>
    <circle cx="720" cy="880" r="1.5"/>
    <circle cx="750" cy="940" r="1.5"/>
    <circle cx="700" cy="960" r="1.5"/>
  </g>

  <!-- 달 (좌상) -->
  <circle cx="100" cy="180" r="60" fill="url(#moonGlow)"/>
  <path d="M 100 130 a 50 50 0 1 0 0 100 a 35 50 0 1 1 0 -100 z" fill="#fff5c8"/>

  <!-- 구름 (우상) -->
  <g>
    <ellipse cx="680" cy="100" rx="90" ry="40" fill="url(#cloudGrad)"/>
    <ellipse cx="730" cy="80" rx="60" ry="30" fill="url(#cloudGrad)"/>
    <ellipse cx="640" cy="80" rx="50" ry="25" fill="url(#cloudGrad)"/>
  </g>

  <!-- 구름 (중상 좌) -->
  <g opacity="0.85">
    <ellipse cx="100" cy="500" rx="100" ry="40" fill="url(#cloudGrad)"/>
    <ellipse cx="50" cy="480" rx="60" ry="28" fill="url(#cloudGrad)"/>
  </g>

  <!-- 하단 구름 (배경) -->
  <g opacity="0.85">
    <ellipse cx="50" cy="1280" rx="160" ry="60" fill="url(#cloudGrad)"/>
    <ellipse cx="180" cy="1300" rx="140" ry="55" fill="url(#cloudGrad)"/>
    <ellipse cx="650" cy="1260" rx="180" ry="65" fill="url(#cloudGrad)"/>
    <ellipse cx="780" cy="1300" rx="140" ry="55" fill="url(#cloudGrad)"/>
    <ellipse cx="430" cy="1340" rx="120" ry="40" fill="url(#cloudGrad)" opacity="0.6"/>
  </g>

  <!-- 하단 구름 (앞쪽 진하게) -->
  <g>
    <ellipse cx="60" cy="1620" rx="220" ry="80" fill="#dec0e8"/>
    <ellipse cx="220" cy="1640" rx="160" ry="65" fill="#e8c8d8"/>
    <ellipse cx="700" cy="1620" rx="200" ry="75" fill="#dec0e8"/>
    <ellipse cx="800" cy="1660" rx="160" ry="60" fill="#e8c8d8"/>
  </g>

  <!-- ============= 회전목마 (좌하) ============= -->
  <g transform="translate(80 1280)">
    <!-- 받침대 -->
    <ellipse cx="120" cy="220" rx="120" ry="20" fill="#a878d4"/>
    <rect x="20" y="190" width="200" height="30" rx="10" fill="#c8a8e8"/>
    <!-- 받침대 별 장식 -->
    <g fill="#ffe080">
      <circle cx="50" cy="205" r="3"/>
      <circle cx="100" cy="205" r="3"/>
      <circle cx="140" cy="205" r="3"/>
      <circle cx="190" cy="205" r="3"/>
    </g>
    <!-- 기둥 -->
    <rect x="115" y="80" width="10" height="120" fill="#d4b48c"/>
    <!-- 천막 -->
    <path d="M 30 80 Q 120 30 210 80 L 200 90 Q 120 50 40 90 Z" fill="url(#tentGrad)"/>
    <!-- 천막 줄 (스트라이프) -->
    <g stroke="#fff" stroke-width="2" fill="none" opacity="0.6">
      <path d="M 60 75 Q 120 50 180 75"/>
      <path d="M 90 70 Q 120 55 150 70"/>
    </g>
    <!-- 천막 위 별 -->
    <g transform="translate(120 30)" fill="#ffe080">
      <path d="M 0 -15 L 4 -4 L 16 -4 L 6 3 L 10 14 L 0 7 L -10 14 L -6 3 L -16 -4 L -4 -4 Z"/>
    </g>
    <!-- 유니콘 (단순화) -->
    <g transform="translate(60 130)">
      <!-- 몸 -->
      <ellipse cx="40" cy="20" rx="40" ry="20" fill="#fff5e8"/>
      <!-- 머리 -->
      <ellipse cx="80" cy="10" rx="18" ry="20" fill="#fff5e8"/>
      <!-- 갈기 -->
      <path d="M 70 -5 Q 75 -15 85 -8 Q 90 -18 95 -5" stroke="#e8a8c8" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- 다리 -->
      <rect x="20" y="35" width="6" height="25" rx="2" fill="#fff5e8"/>
      <rect x="35" y="38" width="6" height="22" rx="2" fill="#fff5e8"/>
      <rect x="55" y="35" width="6" height="25" rx="2" fill="#fff5e8"/>
      <rect x="68" y="38" width="6" height="22" rx="2" fill="#fff5e8"/>
      <!-- 꼬리 -->
      <path d="M 0 15 Q -8 20 -5 35 Q 2 30 5 22" fill="#e8a8c8"/>
      <!-- 눈 -->
      <circle cx="86" cy="8" r="1.5" fill="#3a2554"/>
      <!-- 안장 -->
      <path d="M 30 5 Q 50 0 70 5 L 65 12 Q 50 8 35 12 Z" fill="#a878d4"/>
      <!-- 안장 별 -->
      <path d="M 50 4 L 52 8 L 56 8 L 53 11 L 54 15 L 50 13 L 46 15 L 47 11 L 44 8 L 48 8 Z" fill="#ffe080"/>
    </g>
  </g>

  <!-- ============= 수정구슬 (중앙 하단) ============= -->
  <g transform="translate(360 1480)">
    <!-- 받침대 -->
    <ellipse cx="40" cy="115" rx="50" ry="10" fill="#7a4ec8"/>
    <path d="M -10 95 L 90 95 L 80 115 L 0 115 Z" fill="#a878d4"/>
    <!-- 받침대 별 -->
    <path d="M 40 102 L 42 106 L 46 106 L 43 109 L 44 113 L 40 111 L 36 113 L 37 109 L 34 106 L 38 106 Z" fill="#ffe080"/>
    <!-- 구슬 -->
    <circle cx="40" cy="60" r="40" fill="url(#orb)" stroke="#5b2db8" stroke-width="1"/>
    <!-- 구슬 안 별 -->
    <g fill="#ffe080" opacity="0.85">
      <circle cx="30" cy="55" r="2"/>
      <circle cx="50" cy="65" r="1.5"/>
      <path d="M 40 50 L 41.5 53 L 44.5 53 L 42 55 L 43 58 L 40 56.5 L 37 58 L 38 55 L 35.5 53 L 38.5 53 Z"/>
    </g>
    <!-- 구슬 하이라이트 -->
    <ellipse cx="28" cy="48" rx="10" ry="6" fill="#fff" opacity="0.5"/>
  </g>

  <!-- ============= 타로 카드 두 장 (중하-우) ============= -->
  <g transform="translate(490 1490)">
    <!-- 뒷쪽 카드 (살짝 기울어짐) -->
    <g transform="rotate(-12 50 70)">
      <rect x="0" y="0" width="100" height="140" rx="8" fill="url(#cardGrad)" stroke="#5b2db8" stroke-width="2"/>
      <rect x="6" y="6" width="88" height="128" rx="5" fill="none" stroke="#fff5c8" stroke-width="1" opacity="0.7"/>
      <!-- 달 -->
      <circle cx="50" cy="60" r="22" fill="#fff5c8" opacity="0.95"/>
      <circle cx="58" cy="55" r="18" fill="url(#cardGrad)"/>
      <!-- 작은 별들 -->
      <circle cx="25" cy="35" r="1.5" fill="#fff5c8"/>
      <circle cx="75" cy="100" r="1.5" fill="#fff5c8"/>
      <circle cx="30" cy="105" r="1" fill="#fff5c8"/>
    </g>
    <!-- 앞쪽 카드 -->
    <g transform="translate(60 5) rotate(8 50 70)">
      <rect x="0" y="0" width="100" height="140" rx="8" fill="url(#cardGrad)" stroke="#5b2db8" stroke-width="2"/>
      <rect x="6" y="6" width="88" height="128" rx="5" fill="none" stroke="#fff5c8" stroke-width="1" opacity="0.7"/>
      <!-- 별 (육각) -->
      <g transform="translate(50 60)" fill="#fff5c8">
        <path d="M 0 -22 L 6 -7 L 22 -7 L 9 3 L 14 18 L 0 9 L -14 18 L -9 3 L -22 -7 L -6 -7 Z"/>
        <circle cx="0" cy="0" r="6" fill="url(#cardGrad)"/>
      </g>
      <!-- 작은 별들 -->
      <circle cx="22" cy="100" r="1.5" fill="#fff5c8"/>
      <circle cx="78" cy="35" r="1" fill="#fff5c8"/>
    </g>
  </g>

  <!-- ============= 마법사 모자 (우하) ============= -->
  <g transform="translate(670 1500)">
    <!-- 모자 본체 -->
    <path d="M 30 100 L 70 0 L 110 100 Q 110 110 70 110 Q 30 110 30 100 Z" fill="url(#hatGrad)"/>
    <!-- 모자 끝 살짝 휘어진 표현 (위쪽) -->
    <path d="M 70 0 Q 75 -5 80 5 L 70 0 Z" fill="#5b2db8"/>
    <!-- 띠 (벨트) -->
    <path d="M 32 85 Q 70 95 108 85 L 110 100 Q 70 110 30 100 Z" fill="#e8a8c8"/>
    <!-- 버클 -->
    <rect x="62" y="93" width="16" height="12" rx="2" fill="#ffe080"/>
    <!-- 모자에 별 -->
    <g fill="#fff5c8">
      <path d="M 60 50 L 62 55 L 67 55 L 63 58 L 65 63 L 60 60 L 55 63 L 57 58 L 53 55 L 58 55 Z"/>
      <path d="M 80 30 L 82 33 L 85 33 L 82 35 L 83 38 L 80 36 L 77 38 L 78 35 L 75 33 L 78 33 Z"/>
    </g>
  </g>
</svg>
