<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="인생의 회전목마">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1430"/>
      <stop offset="100%" stop-color="#0d0a14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af6a"/>
      <stop offset="100%" stop-color="#a4853d"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b6de1"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 회전목마 원 (3겹) -->
  <g fill="none" opacity="0.7">
    <circle cx="256" cy="256" r="180" stroke="url(#purple)" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="140" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="3 6"/>
    <circle cx="256" cy="256" r="100" stroke="url(#purple)" stroke-width="2"/>
  </g>

  <!-- 중심 별 (8각) -->
  <g transform="translate(256 256)" fill="url(#gold)">
    <path d="M0,-90 L18,-18 L90,0 L18,18 L0,90 L-18,18 L-90,0 L-18,-18 Z"/>
    <circle r="14" fill="#0d0a14"/>
    <circle r="6" fill="url(#gold)"/>
  </g>

  <!-- 작은 별들 (회전목마 위) -->
  <g fill="url(#gold)" opacity="0.85">
    <circle cx="256" cy="76" r="5"/>
    <circle cx="436" cy="256" r="4"/>
    <circle cx="256" cy="436" r="5"/>
    <circle cx="76" cy="256" r="4"/>
    <circle cx="383" cy="129" r="3"/>
    <circle cx="383" cy="383" r="3"/>
    <circle cx="129" cy="383" r="3"/>
    <circle cx="129" cy="129" r="3"/>
  </g>
</svg>
